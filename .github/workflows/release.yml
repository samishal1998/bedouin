name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl: the bootstrap binary must run on a machine with
          # nothing installed, including no matching libc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - run: cargo build --release --target ${{ matrix.target }}

      # The page is embedded with include_str!, so it has to exist before
      # cargo runs. Without this the sidecar ships build.rs's placeholder --
      # which is why a test asserts the real page is what got embedded.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: bedouin-ui/web

      # The sidecar is not a default member -- the bootstrap binary must not
      # carry an HTTP stack -- so it is built by name, and shipped beside.
      - run: cargo build --release --target ${{ matrix.target }} -p bedouin-ui

      # Same engine as `bedouin install`, for people who want the installer
      # without the rest. Built by name for the same reason as the sidecar.
      - run: cargo build --release --target ${{ matrix.target }} -p bedouin-installer

      - name: Check it is actually static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/${{ matrix.target }}/release/bedouin
          # The whole promise: runs on a bare image with nothing installed.
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release/bedouin:/bedouin:ro" \
            alpine:3 /bedouin --version
          # The installer makes the same promise and is the one people will
          # reach for on a machine with nothing on it.
          docker run --rm \
            -v "$PWD/target/${{ matrix.target }}/release/bedouin-installer:/i:ro" \
            alpine:3 /i --version

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/bedouin-${{ matrix.target }}.tar.gz" bedouin
          tar czf "$GITHUB_WORKSPACE/bedouin-ui-${{ matrix.target }}.tar.gz" bedouin-ui
          tar czf "$GITHUB_WORKSPACE/bedouin-installer-${{ matrix.target }}.tar.gz" bedouin-installer
          cd "$GITHUB_WORKSPACE"
          for n in bedouin bedouin-ui bedouin-installer; do
            shasum -a 256 "$n-${{ matrix.target }}.tar.gz" > "$n-${{ matrix.target }}.tar.gz.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bedouin-${{ matrix.target }}
          path: |
            bedouin-${{ matrix.target }}.tar.gz
            bedouin-${{ matrix.target }}.tar.gz.sha256
            bedouin-ui-${{ matrix.target }}.tar.gz
            bedouin-ui-${{ matrix.target }}.tar.gz.sha256
            bedouin-installer-${{ matrix.target }}.tar.gz
            bedouin-installer-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: One checksums file for all of them
        run: cat dist/*.sha256 | sed 's|dist/||' > dist/SHA256SUMS && rm dist/*.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
