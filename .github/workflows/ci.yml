name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
# The page is embedded with include_str!, so it has to exist before
      # cargo runs. Without this the sidecar ships build.rs's placeholder --
      # which is why a test asserts the real page is what got embedded.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: bedouin-ui/web
      - run: cargo test --all

  # Layer 3 of the test strategy: a real apply against a real package manager.
  # It exists to catch the lies in the in-memory fakes -- a fresh Ubuntu image
  # having no apt lists is not something FakeHost can tell you.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            pre: "true"
            cfg: tests/docker/cfg
            script: tests/docker/smoke.sh
          - image: opensuse/tumbleweed
            pre: "true"
            cfg: tests/docker/suse
            script: tests/docker/suse/smoke.sh
          # dnf had recipes and no test of any kind until a cross-distro run
          # found it. Fedora also reports no ID_LIKE, so `rhel-like` rests
          # entirely on the built-in fallback table.
          - image: fedora:41
            pre: "true"
            cfg: tests/docker/fedora
            script: tests/docker/fedora/smoke.sh
          # `subdir:` and hooks, which need no package manager -- so this runs
          # on the one distro family bedouin has no `Manager` for, and is the
          # only coverage Arch gets. A cross-distro run found openSUSE Leap
          # ships no tar, which the export needs and git does not pull in.
          - image: archlinux:latest
            pre: "sh /bootstrap.sh"
            cfg: tests/docker/gitsub
            script: tests/docker/gitsub/smoke.sh
          - image: opensuse/leap:15.6
            pre: "sh /bootstrap.sh"
            cfg: tests/docker/gitsub
            script: tests/docker/gitsub/smoke.sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      # The same string `bedouin ssh` sends to a new machine, taken from the
      # source rather than retyped, so the two cannot drift. Only the rows
      # whose fixture needs git run it: the ubuntu fixture's point is partly
      # that the image has no apt lists yet.
      - name: extract the ssh bootstrap
        run: awk '/^const BOOTSTRAP_TOOLS/{f=1;next} /^"#;/{f=0} f' bedouin-cli/src/provision.rs > bootstrap.sh
      - name: apply for real, inside ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/bedouin:/bedouin:ro" \
            -v "$PWD/${{ matrix.cfg }}:/cfg:ro" \
            -v "$PWD/${{ matrix.script }}:/smoke.sh:ro" \
            -v "$PWD/bootstrap.sh:/bootstrap.sh:ro" \
            -e HOME=/root ${{ matrix.image }} sh -c '${{ matrix.pre }} && /smoke.sh'
