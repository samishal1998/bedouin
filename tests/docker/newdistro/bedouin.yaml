# Arch and Alpine, which had no package manager at all until 0.19.0. Shell-
# agnostic on purpose: Alpine's default shell is busybox ash, and this fixture
# is about whether pacman and apk work, not about rc files.
version: 0
shell: bash
packages:
  - name: jq
    from:
      arch-like: pacman
      alpine-like: apk
      debian-like: apt
      rhel-like: dnf
      suse-like: zypper
