[package]
name = "bedouin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bedouin"
path = "src/main.rs"

[features]
default = ["tui"]
# Pure Rust, so it links into the musl target unchanged. Gated so a minimal
# build is possible and so the size cost stays measurable.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
bedouin-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = { workspace = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
